# M2：Qwen2.5-7B 在 MetaMathQA 上微调，GSM8K 评测。
# 目标：验证 PiSSA 在数学能力最强的 7B 开源模型上泛用性。
# 与 M1 统一参数 (r=128, α=128, global_batch=128) → 仅模型不同。

experiment: m2_qwen25_7b

# ---- 模型 ----
model:
  name: Qwen2.5-7B
  source: local                     # 走 local_path 直指已下载目录，不触发 ModelScope 重新下载
  local_path: data/m2/models/Qwen2.5-7B/Qwen/Qwen2___5-7B

# ---- 数据（复用 M1 已处理的 jsonl）----
data:
  train_jsonl: data/m1/metamath_train.jsonl     # 全量 100K，训练用 --limit 20000
  gsm8k_jsonl: data/m1/gsm8k_test.jsonl
  num_train_samples: 20000

# ---- 适配器（与 M1 完全一致）----
adapter:
  r: 128
  alpha: 128
  dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  niter: null

# ---- 优化器 / 调度 ----
optim:
  learning_rate: 2.0e-5
  weight_decay: 0.0
  lr_scheduler: cosine
  warmup_ratio: 0.03

# ---- 训练通用 ----
train:
  num_epochs: 1
  max_seq_len: 1024
  loss_on_response_only: true
  seed: 42
  log_every: 10
  save_merged_dtype: bfloat16

# ---- M2 方法：bf16 全路径（20K 样本、无需梯度检查点、速度优先）----
methods:
  pissa:
    dtype: bfloat16
    per_device_batch: 8         # Qwen2.5 词表 152k，bs=16 时 logits 张量 ~10GB(fp32)，OOM
    grad_accum: 16              # 8 × 16 = 128
    optimizer: adamw
    grad_checkpointing: false
    learning_rate: null
  lora:
    dtype: bfloat16
    per_device_batch: 8
    grad_accum: 16
    optimizer: adamw
    grad_checkpointing: false
    learning_rate: null
  full:
    # M2 不跑 Full-FT——目标是证 PiSSA vs LoRA 的泛用性，不需要全量基线。
    # 此处保留占位以保持 config 结构与 M1 兼容，但不会被调用。
    dtype: bfloat16
    per_device_batch: 4
    grad_accum: 32
    optimizer: adamw_8bit
    grad_checkpointing: true
    learning_rate: null

# ---- 评测 ----
eval:
  max_new_tokens: 512
  batch_size: 16

# ---- 产物路径 ----
paths:
  output_dir: results/m2_qwen25_7b/exp1
  ckpt_dir: checkpoints/m2_qwen25_7b
