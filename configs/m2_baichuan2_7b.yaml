# M2：Baichuan2-7B-Base 在 MetaMathQA 上微调，GSM8K 评测。
# 目标：验证 PiSSA 在 Baichuan 架构（ALiBi 替代 RoPE，不同归一化）上的泛用性。

experiment: m2_baichuan2_7b

model:
  name: Baichuan2-7B-Base
  source: local
  local_path: data/m2/models/Baichuan2-7B-Base/baichuan-inc/Baichuan2-7B-Base
  trust_remote_code: true            # Baichuan2 权重目录含自定义代码
  low_cpu_mem_usage: false           # Baichuan2 自定义加载不兼容 meta device

data:
  train_jsonl: data/m1/metamath_train.jsonl
  gsm8k_jsonl: data/m1/gsm8k_test.jsonl
  num_train_samples: 20000

adapter:
  r: 128
  alpha: 128
  dropout: 0.0
  target_modules:                  # Baichuan2 使用 LLaMA 风格命名
    - W_pack
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  niter: null

optim:
  learning_rate: 2.0e-5
  weight_decay: 0.0
  lr_scheduler: cosine
  warmup_ratio: 0.03

train:
  num_epochs: 1
  max_seq_len: 1024
  loss_on_response_only: true
  seed: 42
  log_every: 10
  save_merged_dtype: bfloat16

# ---- 每种方法的显存策略（96GB 单卡）----
# 与论文一致：PiSSA/LoRA 的基座与适配器都用 FP32（论文 Sec.5："Float32 computation type for both the base model and the adapter"）。
# 若 FP32 在某个模型上 OOM，按固定顺序退让（每步只改一个变量，并在结果中标注）：
#   1) 降 per_device_batch 并等比例增大 grad_accum，保持全局 batch=128；
#   2) 确认 grad_checkpointing: true；
#   3) 最后才改 dtype: bfloat16（此时适配器精度也随之改变，PiSSA 与 LoRA 必须用同一 dtype）。
methods:
  pissa:
    dtype: float32
    per_device_batch: 4
    grad_accum: 32
    optimizer: adamw
    grad_checkpointing: true   # fp32 激活占显存，需开检查点（同 M1）
    learning_rate: null
  lora:
    dtype: float32
    per_device_batch: 4
    grad_accum: 32
    optimizer: adamw
    grad_checkpointing: true   # fp32 激活占显存，需开检查点（同 M1）
    learning_rate: null
  full:
    dtype: bfloat16
    per_device_batch: 4
    grad_accum: 32
    optimizer: adamw_8bit
    grad_checkpointing: true
    learning_rate: null

eval:
  max_new_tokens: 512
  batch_size: 16

paths:
  output_dir: results/m2_baichuan2_7b/exp1
  ckpt_dir: checkpoints/m2_baichuan2_7b
